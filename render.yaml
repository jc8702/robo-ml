services:
  - type: web
    name: robo-ml-bot
    env: docker
    dockerfilePath: ./Dockerfile
    plan: free
    autoDeploy: true
    healthCheckPath: /
    # IMPORTANTE: Configure TODAS as variáveis abaixo pelo Dashboard do Render (Environment).
    # Nunca commite credenciais ou dados pessoais neste arquivo.
    envVars:
      - key: DATABASE_URL
        sync: false  # Configurar via Dashboard do Render
      - key: ML_AFFILIATE_ID
        sync: false
      - key: ML_AFFILIATE_WORD
        sync: false
      - key: WHATSAPP_PHONE
        sync: false
      - key: USE_PAIRING_CODE
        value: "false"
      - key: WHATSAPP_GROUP_ID
        sync: false
      - key: FB_ENABLED
        value: "true"
      - key: FB_MAX_GROUPS_PER_CYCLE
        value: "64"
      - key: FB_DELAY_BETWEEN_POSTS
        value: "60"
      - key: FB_WA_GROUP_LINK
        sync: false
      - key: AUTO_SCHEDULE_CRON
        value: "0 */3 * * *"
    disk:
      name: bot-storage
      mountPath: /app/.wa-auth
      sizeGB: 1
